name: Release

# Pushing a tag equal to manifest.json's version (e.g. `0.1.0`, no `v`
# prefix) builds the plugin and drafts a GitHub release carrying the three
# files Obsidian installs: main.js, manifest.json, styles.css.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  # Build provenance attestations for the release assets.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check tag matches manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $version" >&2
            exit 1
          fi

      - run: pnpm build

      - run: pnpm test

      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            apps/obsidian-plugin/main.js
            manifest.json
            apps/obsidian-plugin/styles.css

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --draft \
            apps/obsidian-plugin/main.js manifest.json apps/obsidian-plugin/styles.css
