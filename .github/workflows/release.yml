# Pushing a tag builds the plugin and drafts a GitHub release with the three
# assets Obsidian installs from: main.js, manifest.json, styles.css.
# Follows https://docs.obsidian.md/Plugins/Releasing/Release+your+plugin+with+GitHub+Actions,
# adapted to this pnpm monorepo (bundle and styles live in apps/obsidian-plugin).
name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6

      # Obsidian downloads assets from the release whose tag equals
      # manifest.json's version, and resolves older apps through versions.json.
      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag '$tag' does not match manifest.json version '$version'"
            exit 1
          fi
          if ! node -e "process.exit(require('./versions.json')[process.argv[1]] ? 0 : 1)" "$tag"; then
            echo "::error::versions.json has no entry for '$tag'"
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build plugin
        run: pnpm build

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            apps/obsidian-plugin/main.js
            manifest.json
            apps/obsidian-plugin/styles.css

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title="$GITHUB_REF_NAME" \
            --draft \
            apps/obsidian-plugin/main.js manifest.json apps/obsidian-plugin/styles.css
